name: Build

on:
  push:
    paths:
      - .github/workflows/main.yml
      - biome.json
      - tsconfig.json
      - package.json
      - bun.lock
      - "**.ts"

env:
  CF_CRON: "0 * * * *"
  CF_API_TOKEN: "token"
  CF_ZONE_ID: "zone_id"
  CF_RECORD_NAME: "record_name"

jobs:
  build:
    uses: winstxnhdw/actions/.github/workflows/bun.yml@main
    with:
      disable-build: true
      disable-test: true
